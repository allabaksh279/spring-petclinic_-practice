name: Manual Maven Steps for CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  checks: write
  contents: read
  pull-requests: write
  actions: read
  security-events: write

jobs:
  call-reusable:
    uses: ./.github/workflow/reusable-mvn.yaml
    with:
      java-version: '21'
      agent: 'ubuntu-latest'
  